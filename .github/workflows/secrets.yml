# Depoda gizli bilgi (parola, token, API anahtarı) arar (FOG-17).
name: Gizli bilgi taraması

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Depoyu geçmişiyle birlikte indir
        uses: actions/checkout@v7.0.1
        with:
          # 0: bütün geçmiş. Silinmiş bir dosyadaki gizli bilgi de geçmişte durur; o da taranır.
          fetch-depth: 0

      # gitleaks kendi resmi imajından, sabit sürümle çalıştırılır. Depo salt okunur bağlanır.
      # --redact: bir bulgu olursa değeri CI loguna yazılmaz.
      - name: Bütün geçmişi tara
        run: >
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner
