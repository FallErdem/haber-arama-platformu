# Geliştirme ortamında e-postaları yakalayan sahte SMTP sunucusu (ADR-0014).
# Verisi kalıcı değildir; pod yeniden başlarsa yakalanan e-postalar silinir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:v1.33.1
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi