# React frontend: derlenmiş dosyaları sunan nginx (ADR-0018). Durum tutmaz.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        # nginx-unprivileged imajındaki nginx kullanıcısı.
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
      containers:
        - name: frontend
          # Etiket overlay'de verilir (commit özeti); scripts/dev/deploy-frontend.sh günceller.
          image: haber-registry.localhost:5000/newssearch-frontend
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
