apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: haber
resources:
  - namespace.yaml
  - postgres/cluster.yaml
  - postgres/database-keycloak.yaml
  - elasticsearch/statefulset.yaml
  - elasticsearch/service.yaml
  - elasticsearch/setup-job.yaml
  - minio/statefulset.yaml
  - minio/service.yaml
  - minio/setup-job.yaml
  - mailpit/deployment.yaml
  - mailpit/service.yaml
  - keycloak/deployment.yaml
  - keycloak/service.yaml
  - keycloak/httproute.yaml
configMapGenerator:
  - name: keycloak-realm
    files:
      - keycloak/realm-haber.json