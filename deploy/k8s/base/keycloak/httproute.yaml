# haber.local/auth ile başlayan istekleri Keycloak'a yönlendirir.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - haber.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: keycloak
          port: 8080