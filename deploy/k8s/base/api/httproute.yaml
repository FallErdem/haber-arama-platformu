# haber.local/api ile başlayan istekleri API'ye yönlendirir. Sağlık adresleri
# (/actuator) bu yolun altında olmadığı için dışarıdan erişilemez.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - haber.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 8080
