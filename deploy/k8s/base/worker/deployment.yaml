# Python işçisi (ADR-0017): bütün arka plan işlerini yürütür. Dışarıdan istek almaz;
# bu yüzden Service'i ve trafik kuralı yoktur.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # İşçi tek kopya çalışır: iki kopya aynı beslemeyi aynı anda okurdu.
  replicas: 1
  # Recreate: yeni sürüm dağıtılırken önce eski pod durdurulur, sonra yenisi başlar.
  # Varsayılan yöntem (RollingUpdate) ikisini kısa süre birlikte çalıştırırdı.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      # Prometheus bu etiketli pod'ların ölçümlerini okur (deploy/k8s/platform/prometheus).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Pod durdurulurken işçi elindeki beslemeyi bitirir; bu en kötü durumda 40 saniye sürebilir
      # (10 sn istek aralığı + 30 sn indirme). Varsayılan 30 saniye yerine 60 saniye tanınır.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: worker
          # Etiket overlay'de verilir (commit özeti); scripts/dev/deploy-worker.sh günceller.
          image: haber-registry.localhost:5000/newssearch-worker
          ports:
            - name: health
              containerPort: 8080
          env:
            # Veritabanı: CloudNativePG'nin oluşturduğu yazma servisi (postgres-rw).
            - name: DB_HOST
              value: postgres-rw
            # İşçi yalnızca kendi kullanıcısıyla bağlanır (news_worker); kullanıcı adı uygulamadaki varsayılandır.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-news-worker
                  key: password
            # Arama indeksi: outbox aktarımı haberleri buraya yazar (ADR-0012). Küme içinde TLS yoktur (bkz. İ-32).
            - name: ES_URL
              value: http://elasticsearch:9200
            # Elasticsearch'te de yalnızca işçinin kendi kullanıcısı (news_worker); kullanıcı adı uygulamadaki varsayılandır.
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-news-worker
                  key: password
            # Görseller: nesne depolama (MinIO). İşçi yalnızca kendi kullanıcısıyla bağlanır (news-worker);
            # kullanıcı adı uygulamadaki varsayılandır.
            - name: MINIO_URL
              value: http://minio:9000
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-news-worker
                  key: password
            # NYT Top Stories API anahtarı (ADR-0009). Zorunlu değildir: boşsa veya Secret'ta yoksa işçi NYT
            # beslemelerini okumaz ve durumu açılışta audit'e yazar. Anahtar yalnızca istek anında adrese eklenir.
            - name: NYT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nyt-api
                  key: api_key
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            # 1Gi: NYT eklendikten sonra işçi 384Mi sınırında, NYT'nin 2048 piksellik görsellerini işlerken art arda
            # öldürüldü (24 Kasım 2026, OOMKilled). Sınır önce 640Mi yapıldı; işçi orada da en çok 638 MiB'a çıktı ve
            # 27 Kasım'da 137 çıkış koduyla yeniden başladı. 768Mi ile çalışırken de 765 MiB görüldü: kullanım sınıra
            # doğru büyüyor. 1Gi bu tepelerin üstünde pay bırakır.
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz/live
              port: health
            periodSeconds: 2
            failureThreshold: 30
          # Hazır: tablolar görünüyor ve zamanlayıcının son turu başarılı. Tablolar
          # beklenirken işçi "ayakta ama hazır değil" görünür; yeniden başlatılmaz.
          # Elasticsearch'e bakılmaz: o kapalıyken de haber toplama sürer, notlar PostgreSQL'de birikir.
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: health
            periodSeconds: 10
          # Yanıt vermiyorsa Kubernetes pod'u yeniden başlatır.
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: health
            periodSeconds: 10
