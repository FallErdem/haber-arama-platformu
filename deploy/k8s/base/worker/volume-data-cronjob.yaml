# Hacim testi için deneme haberleri (FOG-07, İ-35): news_worker/volume_data.py.
#
# Bu CronJob kendiliğinden hiç çalışmaz (suspend: true); yalnızca elle başlatılan işin kalıbıdır.
# Önce yönetim panelinden kapalı bir DENEME kaynağı ve beslemesi oluşturulur, sonra:
#
#   kubectl create job -n haber --from=cronjob/worker-volume-data worker-volume-data-1
#
# Haberler gerçek toplama yolundan kaydedilir; outbox aktarımı onları Elasticsearch'e yazar. İşçinin
# durdurulması gerekmez. Yarıda kalırsa yeni bir adla yeniden başlatılır; kayıtlı haberler atlanır.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: worker-volume-data
spec:
  # Zamanlama alanı zorunludur; suspend açık olduğu için bu saatte de çalışmaz.
  schedule: "0 0 1 1 *"
  suspend: true
  jobTemplate:
    spec:
      # Başarısız olursa kendiliğinden yeniden denenmez; nedenine bakılıp elle yeniden başlatılır.
      backoffLimit: 0
      # Biten Job ve logu bir gün sonra kendiliğinden silinir.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: worker-volume-data
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          containers:
            - name: volume-data
              # İşçinin imajı; etiketi overlay'de işçiyle birlikte güncellenir.
              image: haber-registry.localhost:5000/newssearch-worker
              command: ["news-worker-generate-volume-data", "--count", "1000000"]
              env:
                - name: DB_HOST
                  value: postgres-rw
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-news-worker
                      key: password
                # Kelime dağılımı gerçek haberlerin Elasticsearch'teki metinlerinden çıkarılır.
                - name: ES_URL
                  value: http://elasticsearch:9200
                - name: ES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: elasticsearch-news-worker
                      key: password
                # Komut MinIO'yu kullanmaz, ama işçinin ayar sınıfı MinIO şifresini zorunlu tutar.
                - name: MINIO_URL
                  value: http://minio:9000
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-news-worker
                      key: password
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                # Kelime dağılımı ve örnek metinler bellekte tutulur.
                limits:
                  memory: 512Mi
