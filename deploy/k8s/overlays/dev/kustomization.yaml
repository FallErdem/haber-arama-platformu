apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: haber
resources:
  - ../../base
images:
  # Kümede çalışan imajların etiketleri: imajın derlendiği commit'in kısa özeti.
  # scripts/dev/ altındaki deploy-*.sh betikleri her dağıtımda kendi satırını günceller.
  - name: haber-registry.localhost:5000/newssearch-api
    newTag: "8ccd9c0"
  - name: haber-registry.localhost:5000/newssearch-frontend
    newTag: "0e9402c"
  - name: haber-registry.localhost:5000/newssearch-worker
    newTag: "14b0632"
generatorOptions:
  # CloudNativePG, Secret'lara adlarıyla başvurur; Kustomize'ın adlara eklediği özet sonekini kapatıyoruz.
  disableNameSuffixHash: true
secretGenerator:
  - name: postgres-news-owner
    type: kubernetes.io/basic-auth
    envs:
      - secrets/postgres-news-owner.env
  - name: postgres-news-app
    type: kubernetes.io/basic-auth
    envs:
      - secrets/postgres-news-app.env
  - name: postgres-news-worker
    type: kubernetes.io/basic-auth
    envs:
      - secrets/postgres-news-worker.env
  - name: postgres-news-backup
    type: kubernetes.io/basic-auth
    envs:
      - secrets/postgres-news-backup.env
  - name: postgres-keycloak
    type: kubernetes.io/basic-auth
    envs:
      - secrets/postgres-keycloak.env
  - name: elasticsearch-elastic
    envs:
      - secrets/elasticsearch-elastic.env
  - name: elasticsearch-news-worker
    envs:
      - secrets/elasticsearch-news-worker.env
  - name: elasticsearch-news-api
    envs:
      - secrets/elasticsearch-news-api.env
  - name: minio-root
    envs:
      - secrets/minio-root.env
  - name: minio-news-worker
    envs:
      - secrets/minio-news-worker.env
  - name: minio-news-api
    envs:
      - secrets/minio-news-api.env
  - name: minio-backup
    envs:
      - secrets/minio-backup.env
  - name: keycloak-admin
    envs:
      - secrets/keycloak-admin.env
  - name: api-settings
    envs:
      - secrets/api-settings.env
  - name: api-media-signing
    envs:
      - secrets/api-media-signing.env
