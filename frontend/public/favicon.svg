<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Sekme simgesi: üst çubuktaki logonun aynısı (src/components/Logo.tsx). Renkler tarayıcının açık/koyu ayarına uyar. -->
  <style>
    .bg { fill: oklch(0.45 0.14 25); }
    .fg { fill: oklch(0.985 0.006 85); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: oklch(0.72 0.12 25); }
      .fg { fill: oklch(0.19 0.008 60); }
    }
  </style>
  <rect class="bg" x="2" y="2" width="28" height="28" rx="6" />
  <text class="fg" x="16" y="23" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700">H</text>
  <rect class="fg" x="9" y="25" width="14" height="1.6" rx="0.8" />
</svg>
