# React uygulamasının derlenmiş dosyalarını sunar. nginx burada yalnızca statik
# dosya sunucusudur; API ve Keycloak istekleri buraya gelmez, Gateway onları
# kendi servislerine yönlendirir.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Tek sayfalık uygulama: /oidc-callback gibi dosya karşılığı olmayan adreslerde
    # de index.html sunulur; hangi ekranın gösterileceğine tarayıcıdaki kod karar verir.
    location / {
        try_files $uri /index.html;
        # index.html önbelleğe alınmaz; yeni sürüm dağıtıldığında tarayıcı hemen görür.
        add_header Cache-Control "no-cache";
    }

    # Derleme, bu klasördeki dosyaların adına içerik özeti koyar (index-JWUbqJEi.js gibi);
    # içerik değişince ad da değişir. Bu yüzden uzun süre önbellekte tutulabilirler.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
