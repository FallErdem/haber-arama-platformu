[project]
name = "news-worker"
version = "0.1.0"
description = "Haber Arama Platformu arka plan işçisi"
requires-python = ">=3.14"
dependencies = [
    "boto3==1.43.123",
    "botocore==1.43.123",
    "elasticsearch==9.4.1",
    "feedparser==6.0.14",
    "httpx==0.28.1",
    "nh3==0.3.7",
    "pillow==13.0.0",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.6",
]

[project.scripts]
news-worker = "news_worker.app:main"
# Tam yeniden indeksleme; elle çalıştırılır (bkz. news_worker/reindex.py).
news-worker-reindex = "news_worker.reindex:main"
# Daha önce indirilmiş görsellerin WebP'ye çevrilmesi; bir kez, elle çalıştırılır (bkz. news_worker/convert_media.py).
news-worker-convert-media = "news_worker.convert_media:main"
# Hacim testi için deneme haberleri; elle çalıştırılır (bkz. news_worker/volume_data.py).
news-worker-generate-volume-data = "news_worker.volume_data:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.15.0",
    "types-boto3-s3==1.44.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# async test fonksiyonları ek işaret gerektirmeden çalışır.
asyncio_mode = "auto"
# Her test kendi olay döngüsüyle çalışır; testler birbirini etkilemez.
asyncio_default_fixture_loop_scope = "function"
# --cov-fail-under: satır kapsamı %80'in altındaysa test çalıştırması başarısız sayılır (FOG-23).
addopts = "--cov=news_worker --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
# Katı mod: tür ipucu olmayan veya türü belirsiz kod hata sayılır (kodlama standartları 7. bölüm).
strict = true
files = ["src", "tests"]

# feedparser tür bilgisi yayımlamıyor ve ayrı bir tür paketi de yok; yalnızca bu modül için
# "tür bilgisi bulunamadı" hatası kapatılır. Ondan dönen değerler kendi kodumuzda türlenir.
[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

# boto3 ve botocore da tür bilgisi yayımlamıyor. S3 istemcisinin türü test bağımlılığı olan
# types-boto3-s3 paketinden alınır (S3Client); istemciyi kuran tek satır bu türe çevrilir.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# E, W: stil; F: hatalı kod; I: import sırası; B: sık yapılan hatalar;
# UP: eski yazımlar; SIM: sadeleştirme; ASYNC: asyncio hataları.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC"]
