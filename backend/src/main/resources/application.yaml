spring:
  application:
    name: newssearch
  # Uygulamanın normal bağlantısı: yalnızca okuma/yazma yetkisi olan news_app.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/news}
    username: news_app
    password: ${DB_APP_PASSWORD}
  # Geçiş betikleri açılışta tabloların sahibi news_owner ile çalışır (ADR-0018).
  flyway:
    url: ${spring.datasource.url}
    user: news_owner
    password: ${DB_OWNER_PASSWORD}
    locations: classpath:db/migration
  # Arama indeksi (ADR-0011, ADR-0012). API yalnızca okur: news_api kullanıcısının yazma yetkisi yoktur;
  # indeksi ve şablonu Python işçisi yönetir.
  elasticsearch:
    uris: ${ES_URL:http://localhost:9200}
    username: news_api
    password: ${ES_PASSWORD}
    # Elasticsearch yanıt vermiyorsa arama isteği 30 saniye (varsayılan) asılı kalmaz.
    connection-timeout: 2s
    socket-timeout: 5s
  # Token doğrulaması (ADR-0014): imza Keycloak'ın açık anahtarlarıyla,
  # ayrıca yayıncı (iss) ve hedef kitle (aud) kontrol edilir.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URL:http://haber.localhost/auth/realms/haber/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URL:http://haber.localhost/auth/realms/haber}
          audiences: haber-api

# Loglar her ortamda JSON olarak yazılır (FOG-39); istek kimliği her satırda bulunur.
logging:
  structured:
    format:
      console: ecs

# Kubernetes'in "ayakta mı, istek almaya hazır mı" kontrolleri için sağlık adresleri
# (/actuator/health/liveness ve /actuator/health/readiness). Başka hiçbir yönetim
# adresi açılmaz; bu adresler /api altında olmadığı için dışarıdan da erişilemez.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

newssearch:
  media:
    # Görsel adreslerini imzalayan anahtar (API sözleşmesi 4.4); en az 32 karakter, bütün API kopyalarında aynı.
    signing-key: ${MEDIA_SIGNING_KEY}
    # Nesne depolama (MinIO). API yalnızca okur: news-api kullanıcısının yazma yetkisi yoktur.
    storage-url: ${MINIO_URL:http://localhost:9000}
    access-key: news-api
    secret-key: ${MINIO_SECRET_KEY}
    bucket: media
  identity:
    # Bu e-postayla gelen ve e-postası doğrulanmış kullanıcı ilk girişinde aktif
    # yönetici olur (ADR-0014). Boşsa kimse kendiliğinden yönetici olmaz.
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:}
