spring:
  application:
    name: newssearch
  # Uygulamanın normal bağlantısı: yalnızca okuma/yazma yetkisi olan news_app.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/news}
    username: news_app
    password: ${DB_APP_PASSWORD}
  # Geçiş betikleri açılışta tabloların sahibi news_owner ile çalışır (ADR-0018).
  flyway:
    url: ${spring.datasource.url}
    user: news_owner
    password: ${DB_OWNER_PASSWORD}
    locations: classpath:db/migration
  # Token doğrulaması (ADR-0014): imza Keycloak'ın açık anahtarlarıyla,
  # ayrıca yayıncı (iss) ve hedef kitle (aud) kontrol edilir.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URL:http://haber.local/auth/realms/haber/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URL:http://haber.local/auth/realms/haber}
          audiences: haber-api

# Loglar her ortamda JSON olarak yazılır (FOG-39); istek kimliği her satırda bulunur.
logging:
  structured:
    format:
      console: ecs

# Kubernetes'in "ayakta mı, istek almaya hazır mı" kontrolleri için sağlık adresleri
# (/actuator/health/liveness ve /actuator/health/readiness). Başka hiçbir yönetim
# adresi açılmaz; bu adresler /api altında olmadığı için dışarıdan da erişilemez.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

newssearch:
  identity:
    # Bu e-postayla gelen ve e-postası doğrulanmış kullanıcı ilk girişinde aktif
    # yönetici olur (ADR-0014). Boşsa kimse kendiliğinden yönetici olmaz.
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:}
